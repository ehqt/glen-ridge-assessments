name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; the defaults are not sufficient.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # The data bundle is a build input, not something the workflow makes.
      # It has to be committed, because regenerating it would need the raw
      # MOD-IV extract. Fail loudly rather than shipping a site with no data.
      - name: Check the data bundle is present
        run: |
          test -f public/data/glen-ridge.json.gz \
            || { echo "::error::public/data/glen-ridge.json.gz is missing. Run ingest.py and commit the bundle."; exit 1; }
          ls -lh public/data/glen-ridge.json.gz

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
